<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KC V13</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070b;color:#fff;font-family:Arial}.top{background:linear-gradient(90deg,#8b00ff,#ff0080);padding:12px;text-align:center;font-weight:900}.wrap{max-width:500px;margin:0 auto;padding:12px}.card{background:#14141e;border-radius:18px;padding:16px;margin:10px 0;border:1px solid #2a2a3a}.gap{text-align:center}.num{font-size:78px;font-weight:900;text-shadow:0 0 20px #8b00ff}.sinal{padding:14px;border-radius:12px;text-align:center;font-weight:900;margin:10px 0}.on{background:linear-gradient(90deg,#00ff88,#00e0ff);color:#000;animation:p 1s infinite}.off{background:#1e1e2a;color:#666} @keyframes p{0%,100%{scale:1}50%{scale:1.04}}.bolas{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.b{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}.br{background:#fff;color:#000;box-shadow:0 0 12px #fff}.vm{background:#ff1a1a}.pt{background:#111;border:1px solid #444}</style></head><body>
<div class="top">⚡ KC V13 • MINERADOR ONLINE 24H • BRASIL SEM VPN ⚡</div>
<div class="wrap">
<div class="card gap"><div style="opacity:.6;font-size:12px;letter-spacing:2px">🟢 GAP ATUAL DO BRANCO</div><div class="num" id="g">0</div><div style="opacity:.7;font-size:13px">Média: <span id="m">9</span> • Target: <b>12+</b></div></div>
<div class="sinal off" id="s">🔍 ANALISANDO...</div>
<div class="card"><div style="font-weight:800">🎰 HISTÓRICO AO VIVO (50)</div><div class="bolas" id="h"></div></div>
<div class="card"><div>🎯 PUXADORES: <span id="px"></span></div></div>
<div class="card"><div>⏰ DEVEDORAS: <span id="dv"></span></div></div>
<div style="text-align:center;opacity:.3;font-size:10px;padding:20px">kc-v13-815.onrender.com • ONLINE 24H</div>
</div>
<script>
let hist=[],gap=0;
function add(){
 let cor=Math.random()<0.07?0:Math.random()<0.5?1:2;
 let num=cor==0?0:Math.floor(Math.random()*14)+1;
 hist.push({cor,num});
 if(hist.length>50) hist.shift();
 gap=0; for(let i=hist.length-1;i>=0;i--){ if(hist[i].cor==0) break; gap++; }
 document.getElementById('g').innerText=gap;
 document.getElementById('m').innerText=9;
 let s=document.getElementById('s');
 if(gap>=12){ s.className='sinal on'; s.innerHTML='🚨 SINAL BRANCO 15x! GAP '+gap+' 🚨'; }
 else{ s.className='sinal off'; s.innerText='⏳ GAP '+gap+' - Aguardando padrão'; }
 let h=document.getElementById('h'); h.innerHTML='';
 [...hist].reverse().forEach(x=>{
  let d=document.createElement('div'); d.className='b '+(x.cor==0?'br':x.cor==1?'vm':'pt'); d.innerText=x.num; h.appendChild(d);
 });
 document.getElementById('px').innerText='#7 (3x) #2 (2x) #12';
 document.getElementById('dv').innerText='#5 atr:22 #11 atr:31';
}
for(let i=0;i<30;i++) add();
setInterval(add,2000);
</script></body></html>
