<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KC V13 ONLINE</title>
<style>body{background:#08080e;color:#fff;font-family:Arial;text-align:center;padding:40px}.card{background:#15151f;padding:20px;border-radius:16px;max-width:600px;margin:20px auto}</style>
</head>
<body>
<h1>🚀 KC V13 ONLINE 24H</h1>
<div class="card">
<h3>GAP ATUAL: <span id="gap">--</span></h3>
<p>Média: <span id="media">--</span></p>
<p id="motivo">Minerando Brasil sem VPN...</p>
<div id="hist" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px"></div>
</div>
<script>
async function load(){
 try{
  const r=await fetch('/api/analise'); const d=await r.json();
  document.getElementById('gap').innerText=d.gap_atual;
  document.getElementById('media').innerText=d.media_gap;
  document.getElementById('motivo').innerText=d.motivo;
  const h=document.getElementById('hist'); h.innerHTML='';
  (d.historico||[]).slice(-20).forEach(x=>{
    const e=document.createElement('div');
    e.style.cssText='width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;'+(x.cor==0?'background:#fff;color:#000':x.cor==1?'background:#ef4444':'background:#333');
    e.innerText=x.num; h.appendChild(e);
  });
 }catch(e){console.log(e)}
}
setInterval(load,4000); load();
</script>
</body>
</html>
