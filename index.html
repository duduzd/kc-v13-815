<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC V13 REAL ACER</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070b;color:#fff;font-family:Arial}.top{background:linear-gradient(90deg,#00ff88,#8b00ff);padding:12px;text-align:center;font-weight:900}.wrap{max-width:500px;margin:auto;padding:12px}.card{background:#14141e;border-radius:16px;padding:12px;margin:8px 0;border:1px solid #333}.num{font-size:64px;font-weight:900;text-align:center}.sinal{padding:14px;border-radius:12px;text-align:center;font-weight:900}.on{background:linear-gradient(90deg,#00ff88,#00e0ff);color:#000}.off{background:#1e1e2a;color:#888}.bolas{display:flex;gap:5px;overflow-x:auto;padding:8px 0}.b{min-width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}.br{background:#fff;color:#000}.vm{background:#e11}.pt{background:#222;border:1px solid #444}.ok{color:#00ff88}.err{color:#ff5a5a}</style></head><body>
<div class="top">⚡ KC V13 REAL • ACER MINERANDO • <span id="sts">AGUARDANDO ACER</span></div>
<div class="wrap">
<div class="card"><div style="text-align:center;opacity:.6;font-size:11px">GAP + PRESSÃO + CRUZAMENTO REAL</div><div class="num" id="gap">--</div><div style="display:flex;justify-content:space-around;font-size:11px"><span>P: <b id="p">--</b></span><span>C: <b id="c">--</b></span><span id="age">--</span></div></div>
<div class="sinal off" id="s">🔍 Aguardando seu Acer enviar dados...</div>
<div class="card"><div>🎰 AO VIVO <span id="src" class="err">Sem dados do Acer ainda</span></div><div class="bolas" id="h"></div></div>
<div class="card" style="font-size:10px">Como usar: Deixa o script rodando no Acer com VPN. Ele manda os dados pra cá. Aí no celular fica REAL.</div>
</div>
<script>
let hist=[];
function calc(){
 let gap=0; for(let i=hist.length-1;i>=0;i--){ if(hist[i].cor==0) break; gap++; }
 let press=0,last=hist[hist.length-1]?.cor; for(let i=hist.length-1;i>=0;i--){ if(hist[i].cor==last&&hist[i].cor!=0) press++; else break; }
 let cruza=0; for(let i=hist.length-1;i>0;i--){ if(hist[i].cor!=0&&hist[i-1].cor!=0&&hist[i].cor!=hist[i-1].cor) cruza++; else break; }
 document.getElementById('gap').innerText=gap; document.getElementById('p').innerText=press; document.getElementById('c').innerText=cruza;
 let s=document.getElementById('s'); if((press>=5||cruza>=3)&&gap>=8){ s.className='sinal on'; s.innerHTML='🚨 SINAL BRANCO 15x! P'+press+' C'+cruza+' GAP'+gap; } else { s.className='sinal off'; s.innerText='Aguardando P'+press+' C'+cruza+' GAP'+gap; }
 let h=document.getElementById('h'); h.innerHTML=''; [...hist].slice(-20).reverse().forEach(x=>{ let d=document.createElement('div'); d.className='b '+(x.cor==0?'br':x.cor==1?'vm':'pt'); d.innerText=x.num; h.appendChild(d); });
}
async function load(){
 try{
  const r=await fetch('/api/real',{cache:'no-store'}); const j=await r.json();
  if(j.ok){ hist=j.historico; document.getElementById('sts').innerText='REAL DO ACER'; document.getElementById('src').className='ok'; document.getElementById('src').innerText='REAL - '+j.age+'s atrás'; document.getElementById('age').innerText=j.age+'s'; calc(); return; }
 }catch(e){}
 document.getElementById('sts').innerText='AGUARDANDO ACER';
}
setInterval(load,3000); load();
</script></body></html>
