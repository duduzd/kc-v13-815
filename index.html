<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KC V13</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#08080e;color:#e5e7eb;font-family:sans-serif}.card{background:#15151f;border:1px solid #222236}</style></head><body class="p-4"><div class="max-w-6xl mx-auto"><header class="flex justify-between items-center mb-4"><div class="flex items-center gap-2"><div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div><b>KC V13 • ONLINE 24H</b><span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-1 rounded-full">AUTO • BRASIL • SEM VPN</span></div></header><div class="grid grid-cols-3 gap-3"><div class="card rounded-2xl p-4"><div class="text-xs text-zinc-400">GAP ATUAL</div><div id="gapAtual" class="text-4xl font-black">--</div><div class="text-xs">Média: <span id="mediaGap">--</span></div><div id="gapBar" class="mt-3 h-2 bg-[#222236] rounded-full"><div class="h-full bg-white" style="width:0%"></div></div></div><div class="card rounded-2xl p-4"><div class="text-xs">ÚLTIMO SINAL</div><div id="sinalBox" class="mt-2 p-3 rounded-xl bg-[#1a1a25] border border-dashed text-sm">Aguardando...</div><div class="text-[11px]">Motivo: <span id="motivo">--</span></div></div><div class="card rounded-2xl p-4"><div class="text-xs">HISTÓRICO</div><div id="historico" class="flex flex-wrap gap-1.5 mt-3"></div></div></div></div><script>async function fetchAnalise(){try{const r=await fetch('/api/analise');const d=await r.json();document.getElementById('gapAtual').innerText=d.gap_atual;document.getElementById('mediaGap').innerText=d.media_gap;document.getElementById('motivo').innerText=d.motivo||'--';document.querySelector('#gapBar div').style.width=Math.min(100,(d.gap_atual/40)*100)+'%';if(d.sinal){document.getElementById('sinalBox').innerHTML=`<div class="text-green-400 font-black">🚀 SINAL BRANCO 15x - ${d.motivo}</div>`}const h=document.getElementById('historico');h.innerHTML='';(d.historico||[]).slice(-30).forEach(x=>{let c=x.cor==0?'bg-white text-black':x.cor==1?'bg-red-500':'bg-zinc-800';let e=document.createElement('div');e.className=`w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-bold ${c}`;e.innerText=x.num;h.appendChild(e)})}catch(e){}}setInterval(fetchAnalise,4000);fetchAnalise();</script></body></html>
